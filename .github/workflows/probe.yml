name: probe
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    defaults:
      run:
        shell: bash {0}
    steps:
      - run: |
          for u in https://functions.yandexcloud.net/d4e6cg7g7htorga9uq58 https://apigw.yandexcloud.net https://serverless-containers.api.cloud.yandex.net https://cloud.yandex.ru; do
            r=$(curl -sS -o /dev/null -w "%{http_code} c=%{time_connect} ip=%{remote_ip}" -m 15 "$u" 2>&1 || true) && r=$(echo "$r" | tr '\n' ' ')
            echo "::notice::${{ matrix.os }} $u -> $r"
          done
          echo "::notice::${{ matrix.os }} ip $(curl -s -m 10 https://api.ipify.org) dns $(getent hosts functions.yandexcloud.net 2>/dev/null || nslookup functions.yandexcloud.net 2>/dev/null | tail -2 | tr '\n' ' ')"
